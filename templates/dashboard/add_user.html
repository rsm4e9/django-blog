{% extends 'base.html' %}


{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    <!-- left side bar -->
    <!-- load the side bar here! -->
     {% include 'dashboard/sidebar.html' %}

    <!-- Right side bar -->
     <div class="col-md-9">
        {% if perms.auth.add_user %}

    <h2>ADD New User</h2>
    <form action="{% url 'add_user' %}" method="POST">
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn btn-warning">Submit</button>
    </form>
       <br>
       {% else %}
       <h5>You do not have permission to view thi page</h5>
     {% endif %}

     </div>
</div>

{% endblock %}
